<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Viewer — DesFlyer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sanchez&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/document_viewer.css" />
    <link rel="stylesheet" href="/static/share_popover.css" />
    <link rel="stylesheet" href="/static/responsive.css" />
  </head>
  <body class="viewer-page">
    <header class="viewer-header">
      <div class="viewer-file-heading"><a class="viewer-close" href="/documents" aria-label="Close viewer"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></a><span class="viewer-divider"></span><div class="viewer-title-group"><strong id="viewer-filename">Loading document…</strong><span><span id="viewer-employee">—</span><i>·</i><span id="viewer-employee-id">—</span></span></div></div>
      <div class="viewer-header-actions"><button class="viewer-button viewer-share" id="viewer-share" data-share-document="" type="button"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4m-7.5 6.8 7.5 4.4"/></svg>Share</button><button class="viewer-button viewer-download" id="viewer-download" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 18v3h14v-3"/></svg>Download</button></div>
    </header>
    <main class="viewer-layout">
      <section class="viewer-canvas" aria-label="Document preview">
        <div class="viewer-toolbar"><button type="button" id="page-prev" aria-label="Previous page">‹</button><span class="page-indicator"><b id="page-number">1</b> / <span id="page-count">5</span></span><button type="button" id="page-next" aria-label="Next page">›</button><span class="toolbar-divider"></span><button type="button" id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-level">100%</span><button type="button" id="zoom-in" aria-label="Zoom in">+</button><span class="toolbar-divider"></span><button type="button" id="fit-page" aria-label="Fit page"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8z"/></svg></button></div>
        <div class="viewer-page-scroll"><div class="document-page" id="document-page">
          <div class="mock-document" id="mock-document"><div class="skeleton title-skeleton"></div><div class="skeleton-lines"><span></span><span></span><span></span><span></span></div><div class="skeleton-lines lower-lines"><span></span><span></span><span></span></div><div class="signature-row"><div>Signature</div><div>Date</div></div></div>
          <iframe class="actual-preview" id="pdf-preview" title="PDF preview" hidden></iframe>
          <img class="actual-image" id="image-preview" alt="Document preview" hidden />
        </div></div>
      </section>
      <aside class="document-info">
        <header class="info-header"><h1>Document Information</h1><p>Metadata and details for this file.</p></header>
        <div class="info-content">
          <section class="meta-block"><h2>File Name</h2><p id="info-filename">—</p></section>
          <section class="meta-block related-block"><h2 id="related-owner-label">Related Employee</h2><div class="related-person"><span class="mini-avatar" id="info-avatar">SJ</span><span id="info-employee">—</span><span class="employee-code-pill" id="info-employee-id">—</span></div></section>
          <section class="meta-block" id="designation-block"><h2>Designation</h2><p id="info-designation">—</p></section>
          <section class="meta-block"><h2>Category</h2><p><span class="info-category" id="info-category">—</span></p></section>
          <div class="meta-pair"><section class="meta-block"><h2>Format</h2><p id="info-format">—</p></section><section class="meta-block"><h2>Size</h2><p id="info-size">—</p></section></div>
          <section class="meta-block"><h2>Uploaded Date</h2><p id="info-uploaded">—</p></section>
          <section class="meta-block"><h2>Uploaded By</h2><p>Admin System</p></section>
        </div>
        <footer class="info-actions"><button class="info-download" id="info-download" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 18v3h14v-3"/></svg>Download Document</button><button class="info-share" id="info-share" data-share-document="" type="button"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4m-7.5 6.8 7.5 4.4"/></svg>Share Document</button></footer>
      </aside>
    </main>
    <div class="viewer-toast" id="viewer-toast" role="status" aria-live="polite"></div>
    <script src="/static/share_popover.js"></script>
    <script src="/static/document_viewer.js"></script>
  </body>
</html>
